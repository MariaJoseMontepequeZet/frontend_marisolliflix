name: Desplegar en el servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar-marisolliflix-web
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: [self-hosted, marisolliflix]
    steps:
      - uses: actions/checkout@v4

      - name: Copiar el codigo al servidor
        run: |
          mkdir -p "$HOME/marisolliflix/frontend_marisolliflix"
          rsync -a --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' \
            ./ "$HOME/marisolliflix/frontend_marisolliflix/"

      - name: Desplegar la web
        run: $HOME/marisolliflix/desplegar.sh web
