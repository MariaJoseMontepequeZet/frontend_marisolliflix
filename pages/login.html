<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarisolliFlix · Entrar</title>
  <meta name="description" content="Inicia sesión o crea tu cuenta en MarisolliFlix para reseñar películas y votar reseñas.">
  <meta name="theme-color" content="#0f0f14">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MarisolliFlix">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Entrar · MarisolliFlix">
  <meta property="og:description" content="Inicia sesión o crea tu cuenta en MarisolliFlix para reseñar películas y votar reseñas.">
  <meta property="og:url" content="https://marisolliflix.pamcing.me/pages/login.html">
  <meta property="og:image" content="https://marisolliflix.pamcing.me/assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="../index.html">MarisolliFlix</a>
    <nav class="nav">
      <a href="../index.html">Inicio</a>
      <a href="listado.html">Películas</a>
    </nav>
  </header>
  <main>
    <section class="section section--angosta">
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-modo="login" aria-selected="true">Entrar</button>
        <button class="tab" role="tab" data-modo="registro" aria-selected="false">Crear cuenta</button>
      </div>

      <form id="form-login" class="form" method="post" novalidate>
        <label>Correo <input type="email" name="email" autocomplete="email" required></label>
        <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
        <p class="form__error" role="alert" hidden></p>
        <button class="btn" type="submit">Entrar</button>
      </form>

      <form id="form-registro" class="form" method="post" novalidate hidden>
        <label>Nombre de usuario <input type="text" name="username" maxlength="50" autocomplete="username" required></label>
        <label>Correo <input type="email" name="email" autocomplete="email" required></label>
        <label>Contraseña (8 a 72 caracteres) <input type="password" name="password" autocomplete="new-password" required></label>
        <p class="form__error" role="alert" hidden></p>
        <button class="btn" type="submit">Crear cuenta</button>
      </form>
    </section>
  </main>
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
